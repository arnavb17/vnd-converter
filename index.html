<!DOCTYPE html>
<html>
<head>
  <title>VND Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 30px;
    }
    input, button {
      padding: 12px;
      font-size: 18px;
      margin: 10px;
      width: 80%;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <h2>VND to INR </h2>

  <input type="number" id="vnd" placeholder="Enter item price in VND">
  <br>

  <button onclick="convert()">Convert</button>

  <h3 id="result"></h3>

  <script>
//Enter value here
    const inrPaid = 10000;
    const vndReceived = 2700000;

    function convert() {
      let itemVnd = parseFloat(document.getElementById("vnd").value);

      if (!itemVnd) {
        document.getElementById("result").innerHTML = "Enter VND amount";
        return;
      }

      let rate = inrPaid / vndReceived;

      let inrCost = itemVnd * rate;

      document.getElementById("result").innerHTML =
        `₹ ${inrCost.toFixed(2)}`;
    }
  </script>
</body>
</html>
