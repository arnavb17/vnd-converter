<!DOCTYPE html>
<html>
<head>
  <title>VND Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
    }

    h2 {
      color: #ffffff;
      margin-bottom: 25px;
      font-size: 32px;
    }

    input {
      padding: 14px;
      font-size: 22px;
      margin: 10px;
      width: 80%;
      max-width: 320px;
      background-color: #1e1e1e;
      color: white;
      border: 1px solid #333;
      border-radius: 10px;
      outline: none;
      text-align: center;
    }

    input::placeholder {
      color: #888;
    }

    button {
      padding: 14px;
      font-size: 18px;
      margin: 8px;
      min-width: 90px;
      background-color: #ffffff;
      color: #121212;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s ease;
    }

    button:hover {
      opacity: 0.9;
      transform: scale(1.03);
    }

    .button-row {
      margin: 10px 0;
    }

    .convert-btn {
      width: 80%;
      max-width: 320px;
    }

    h3 {
      margin-top: 25px;
      color: #00ff99;
      font-size: 30px;
    }
  </style>
</head>
<body>
  <h2>VND to INR</h2>

  <input type="number" id="vnd" placeholder="Enter item price in VND">
  
  <div class="button-row">
    <button onclick="addZeros('00')">+00</button>
    <button onclick="addZeros('000')">+000</button>
    <button onclick="addZeros('00000')">+00000</button>
  </div>

  <div class="button-row">
    <button onclick="clearInput()">Clear</button>
  </div>

  <button class="convert-btn" onclick="convert()">Convert</button>

  <h3 id="result"></h3>

  <script>
    // Enter your actual forex purchase here
    const inrPaid = 10000;
    const vndReceived = 2700000;

    function addZeros(zeros) {
      let input = document.getElementById("vnd");
      input.value = input.value + zeros;
    }

    function clearInput() {
      document.getElementById("vnd").value = "";
      document.getElementById("result").innerHTML = "";
    }

    function convert() {
      let itemVnd = parseFloat(document.getElementById("vnd").value);

      if (!itemVnd) {
        document.getElementById("result").innerHTML = "Enter VND amount";
        return;
      }

      let rate = inrPaid / vndReceived;
      let inrCost = itemVnd * rate;

      document.getElementById("result").innerHTML =
        `₹ ${inrCost.toFixed(2)}`;
    }
  </script>
</body>
</html>
